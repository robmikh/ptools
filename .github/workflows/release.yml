name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - architecture: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Run tests
        run: cargo test --workspace --all-targets --release --locked --target ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}

      - name: Package workspace binaries
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: >
          .\scripts\package-release.ps1
          -Architecture '${{ matrix.architecture }}'
          -Target '${{ matrix.target }}'
          -Version $env:RELEASE_VERSION

      - name: Upload packaged binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ptools-release-${{ matrix.architecture }}
          path: dist\ptools-*.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ptools-release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum -- *.zip > SHA256SUMS.txt

      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(
            find dist -maxdepth 1 -type f \
              \( -name '*.zip' -o -name 'SHA256SUMS.txt' \) \
              -print | sort
          )
          if (( ${#assets[@]} < 3 )); then
            echo "Expected two architecture archives and a checksum file." >&2
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            prerelease=()
            if [[ "$TAG" == *-* ]]; then
              prerelease+=(--prerelease)
            fi
            gh release create "$TAG" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "$TAG" \
              "${prerelease[@]}"
          fi
